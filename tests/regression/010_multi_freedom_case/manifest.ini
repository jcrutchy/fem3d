Verification=Same bar as 001 (E=210e9, A=0.001, L=2), one load case (Fx=+1000 at node2), solved under two freedom cases. FC_N1FIXED: node1 fixed, node2 free -- u2=1000*2/(210e9*0.001)=9.5238095238095231E-6, R1=-1000. FC_N2FIXED: node2 fixed instead, and the load (applied at node2, now constrained) has no elastic effect on the now-free node1 -- u1=0 exactly, and the full load is carried directly by the node2 support, R2=-1000. Confirms freedom-case selection genuinely changes which dofs are free/constrained, not just relabels output.

