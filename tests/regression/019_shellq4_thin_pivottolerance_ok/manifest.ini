[CASE]
ID=019
Name=20-micron shellq4 plate solves with PivotTolerance=1E-13 (fails at the 1E-10 default)
Status=VERIFIED
Solver=linstatic
Verification=A 2x1 m plate 0.00002 m (20 micron) thick, clamped along one edge, membrane dofs free, transverse unit load at node 2. In SI metres the ratio of the smallest (bending) to largest (membrane) reduced-system diagonal scales like t^2/12, so at this thickness it falls below the default 1E-10 relative pivot threshold and the solver reports a singular system (exit 4) -- a false positive, since the model is fine. PivotTolerance=1E-13 lets it through. Expected tip deflection is derived INDEPENDENTLY of this parameter: the same plate at t=0.0001 m (5x thicker) solves under the default tolerance to 167.18254341490763 m, and pure bending scales as 1/t^3, so 20 micron gives 167.18254341490763*(0.0001/0.00002)^3 = 20897.817926863452 m. The solver's own answer matched this to ~1E-15 relative. Not lowered further by default because real mechanisms produce pivots around 1E-16 relative -- see [SOLVERPARAMS] PivotTolerance in docs/model_format.md.

