Verification=Cross-checked against tests/patch_test/run_patch_test.lpr's standalone "Case Q" (same E=200e9, nu=0.3, thickness=0.05, 2x1 rectangle, strainX=0.001): sigmaX=E/(1-nu^2)*strainX=219780219780.2198*0.001=219780219.7802198 Pa, edge reaction = sigmaX*W*T=10989010.98901099 N split evenly (symmetric BC) => -5494505.494505495 N at each of nodes 1 and 4. sigmaY=sigmaX*nu (Poisson coupling)=65934065.934..., edge reaction=sigmaY*L*T/2=3296703.2967032974 N at each node on the y=0/y=W edges. z/rx/ry/rz left free at nodes 2,3 (no applied load on them) must solve to exactly zero -- membrane, bending, and drilling are fully decoupled by construction in QuadShellStiffnessLocal, so this is not approximate. This is the first regression case to exercise shellq4 through the full pipeline (native-format parsing of thickness/4-node elements, fem_validate, fem_dofmap's generalized ElementGlobalDofs, ElementStiffnessFor's shellq4 dispatch, assembly, prescribed-displacement RHS folding, and reaction recovery) -- the element MATH itself is verified independently and far more thoroughly by run_patch_test.lpr (57 checks); this case's job is to confirm the wiring reproduces that same verified physics, not to re-derive element correctness.

