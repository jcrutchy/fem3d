[CASE]
ID=922
Name=linsparse must reject a tolerance the ill-conditioned model cannot truly reach, not report false convergence
Status=BORKED
Solver=linsparse
Verification=Manual: a 200-bay slender planar truss cantilever (801 elements) at Tolerance=1E-12. The PCG iteration's recursively updated residual drifts from the true residual b-Ax, so it used to report convergence at 1E-12 while the real residual was about 5E-9 (the tip displacement was off from linstatic's direct solution in the 8th digit). PCGSolve now recomputes the true residual when the running estimate says converged, restarts if they disagree, and fails with exit 4 if the true residual still cannot reach Tolerance.

