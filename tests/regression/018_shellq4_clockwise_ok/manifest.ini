[CASE]
ID=018
Name=Clockwise-ordered shellq4 is accepted and matches the counter-clockwise result (016)
Status=VERIFIED
Solver=linstatic
Verification=Identical to 016_shellq4_membrane_patch except the element lists its corner nodes clockwise (1, 4, 3, 2) rather than counter-clockwise (1, 2, 3, 4). The expected values are therefore the SAME closed-form values as 016 (sigmaX=E/(1-nu^2)*strainX, edge reaction sigmaX*W*T split over the two clamped-edge nodes, Poisson reaction sigmaY*L*T/2). Exists to lock in a property that an external review wrongly assumed was a defect: node winding does not matter, because the element's local frame is built from its own corner ordering, so reversing the order only flips the local normal (checked directly: worst relative difference vs 016 was 3.4e-16). fem_validate's corner-orientation check must therefore reject concave corners and bow-tie orderings (cases 914-916) but NOT clockwise winding.

