[CASE]
ID=035
Name=Modal analysis of a beam cantilever with FREE rotational dofs (static condensation of the massless rotations)
Status=VERIFIED
Solver=modal
Verification=Independent NumPy reference built a different way: the nonzero eigenvalues mu of Kff^-1*M (mu = 1/omega^2) for the full 12-dof free system with translation-only lumped mass, so it never forms the condensed matrix modal uses. All six frequencies agree to about 1e-15 relative. Modes 1-2 and 3-4 are the two bending directions (Iz = 4*Iy, so non-degenerate); 5-6 are axial. Before this change modal refused this model outright (old case 906).

