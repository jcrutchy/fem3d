[CASE]
ID=007
Name=L-shaped cantilever moment frame
Status=VERIFIED
Solver=linstatic
Verification=Cantilever (single fixed support) is statically determinate regardless of internal bends, so reactions come from pure global statics: sum Fy=1000 (balancing the -1000 tip load), Mz=|r x F| about the base=4000 (r=(4,3,0), F=(0,-1000,0)); tip displacements cross-checked against an independent NumPy assembly of the same validated beam formulation (see 004). Out-of-plane dofs (z,rx,ry) are exactly zero, as expected for a purely in-plane load on a planar frame -- itself a check against spurious coupling in the beam transform.

