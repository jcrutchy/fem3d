[CASE]
ID=017
Name=Shellq8 pure-membrane extension via prescribed displacement (first end-to-end shellq8 case)
Status=VERIFIED
Solver=linstatic
Verification=Same setup as 016_shellq4_membrane_patch (E=200e9, nu=0.3, thickness=0.05, 2x1 rectangle, constrained-width strainX=0.001, giving sigmaX=E/(1-nu^2)*strainX=219780219.7802198 Pa and sigmaY=sigmaX*nu=65934065.93406594 Pa via the same Poisson-coupling mechanism), extended to shellq8's 4 extra midside nodes by prescribing the exact same field (u=strainX*x, v=0) at every node -- exact for this element per the linear-field isoparametric-reproduction argument used throughout run_q8_*_test.lpr. The new thing this case checks beyond 016: the total reaction on each constrained edge (clamped edge x-reactions summed over nodes 1,4,8; each y=const edge's y-reactions summed over its 3 nodes) matches the SAME closed-form total as 016's single-edge reactions (sigmaX*W*T=10989010.98901099 N in x, sigmaY*L*T=6593406.593406594 N in y), split across corner and midside nodes in the standard 1:4:1 ratio for a uniform traction integrated against a quadratic (Q8) edge's shape functions (corner=total/6, midside=4*total/6) -- confirming the native-format 8-node parsing, fem_validate's new shellq8 flatness/midside checks, fem_dofmap's generalized ElementGlobalDofs, ElementStiffnessFor's shellq8 dispatch, assembly, prescribed-displacement RHS folding, and reaction recovery all reproduce the expected physics through the full pipeline. Independently cross-checked in Python against the closed-form total/1:4:1 split before being written into this manifest -- matched to solver tolerance. z/rx/ry/rz free at every non-clamped node must solve to exactly zero (membrane/bending/drilling fully decoupled by construction in QuadShellStiffnessQ8Local) -- also checked. The element MATH itself is verified independently and far more thoroughly by run_q8_membrane_test.lpr, run_q8_plate_test.lpr, run_q8_shell_test.lpr, and run_q8_shell3d_test.lpr (44 checks); this case's job is to confirm the wiring reproduces that same verified physics, not to re-derive element correctness.

