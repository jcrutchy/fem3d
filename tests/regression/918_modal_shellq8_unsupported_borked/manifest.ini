[CASE]
ID=918
Name=Modal on a shellq8 element must be rejected (no shell mass matrix implemented yet)
Status=BORKED
Solver=modal
Verification=Manual: shellq8 was wired into every part of the pipeline EXCEPT modal, so this case checks the one place it could have slipped through unnoticed. modal.lpr's AddElementMass only implements a 2-node line-element lumped mass and rejects anything that is not "truss" or "beam" by name -- a generic check, so it covers shellq8 automatically, but that was verified rather than assumed: without this case, a shellq8 model would have had no test proving it is rejected instead of silently getting a wrong mass matrix by misreading NodeIds[0]/[1] as a 2-node element. (The model sets rho and uses only zero constraints so that execution actually reaches the element-type check rather than tripping an earlier, unrelated modal check first.)

