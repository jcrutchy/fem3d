Verification=Each buildable catalogue section (universal beams, columns, bearing piles, parallel flange channels) is rebuilt from its printed d, bf, tf, tw, r1, run through the section calculator, and compared with the catalogue's own Ag, Ix, Iy, Zx, Sx, Zy, Sy, J (and XL for channels). The catalogue values are printed to 3 significant figures, and its J uses its own method, so the tolerances below are the measured agreement, not machine precision.

